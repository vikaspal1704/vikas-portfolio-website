<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="author" content="Vikas Pal" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="theme-color" content="#05070a" />
    <!--seo:verification-->

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Vikas Pal" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="A portfolio that runs a real exchange engine and an AI analyst in your browser. Ask it anything, or paste a job description." />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vikas Pal's portfolio: a live order-book heatmap behind his name" />
    <meta property="profile:first_name" content="Vikas" />
    <meta property="profile:last_name" content="Pal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%og.png" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <!-- Self-hosted fonts: preload the hero faces so the name renders without a layout shift. -->
    <link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!--seo:jsonld-->
  </head>
  <body>
    <!-- Static profile for crawlers and no-JS readers; React replaces it on boot (same facts, from profile.ts). -->
    <div id="root"><!--seo:static-root--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
